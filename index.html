<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Library</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"><style>:root{--ink:#292622;--muted:#817a71;--paper:#fbfaf8;--wood:#8b6249;--dark:#593827}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Mono",monospace}.page{max-width:1250px;margin:auto;padding:55px clamp(18px,6vw,85px)}header{text-align:center}.eyebrow{color:var(--muted);font-size:10px;letter-spacing:.2em;text-transform:uppercase}h1{font:italic 500 clamp(45px,7vw,90px)/1 "Playfair Display",serif;letter-spacing:-.05em;margin:17px 0}.sub{color:var(--muted);font:17px/1.5 "Playfair Display",serif;margin:auto;max-width:440px}.actions{display:flex;gap:10px;justify-content:center;margin:30px 0 55px}button{background:#fff;border:1px solid #d9d1c9;border-radius:99px;color:var(--ink);cursor:pointer;font:500 11px "DM Mono",monospace;letter-spacing:.08em;padding:12px 17px;text-transform:uppercase}button.primary{background:var(--ink);color:#fff}.reading{border:1px solid #e6dfd8;display:flex;gap:18px;align-items:center;justify-content:center;margin:0 auto 58px;padding:18px;max-width:520px}.reading-label{color:var(--muted);font-size:9px;letter-spacing:.14em;text-transform:uppercase}.reading-title{font:italic 19px "Playfair Display",serif;margin-top:5px}.shelf-title{color:var(--muted);font-size:10px;letter-spacing:.16em;margin-bottom:18px;text-transform:uppercase}.shelf{align-items:flex-end;background:linear-gradient(#fbfaf8 0 88%,#b99476 88% 92%,var(--dark) 92%);display:flex;gap:3px;min-height:330px;overflow-x:auto;padding:25px 22px 31px}.spine{align-items:center;background:var(--color);border:1px solid rgba(0,0,0,.28);border-radius:2px 2px 0 0;box-shadow:inset 3px 0 rgba(255,255,255,.14),inset -4px 0 rgba(0,0,0,.13);color:#fff;cursor:pointer;display:flex;flex:0 0 var(--width);height:var(--height);justify-content:center;min-width:25px;position:relative;transition:transform .2s}.spine:hover,.spine:focus{transform:translateY(-16px);z-index:2}.spine span{font:500 11px "Playfair Display",serif;letter-spacing:.03em;max-height:90%;overflow:hidden;text-align:center;writing-mode:vertical-rl}.spine small{background:#fff;color:var(--ink);font-size:8px;left:50%;opacity:0;padding:6px;pointer-events:none;position:absolute;top:-42px;transform:translateX(-50%);white-space:nowrap}.spine:hover small,.spine:focus small{opacity:1}.empty{color:var(--muted);margin:auto}.modal{align-items:center;background:rgba(35,30,26,.38);display:none;inset:0;justify-content:center;padding:20px;position:fixed;z-index:5}.modal.open{display:flex}.card{background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.18);max-width:430px;padding:30px;width:100%}.card h2{font:italic 28px "Playfair Display",serif;margin:0 0 8px}.card p{color:var(--muted);font-size:12px;line-height:1.6}label{display:block;font-size:10px;letter-spacing:.08em;margin-top:16px;text-transform:uppercase}input,select{background:#fcfbf9;border:1px solid #ddd5cd;font:14px "DM Mono",monospace;margin-top:6px;padding:12px;width:100%}.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}@media(max-width:560px){.page{padding-top:35px}.shelf{min-height:275px;padding-inline:12px}.reading{align-items:flex-start;flex-direction:column}}</style></head><body><div class="page"><header><div class="eyebrow">Jobayer Hosen's collection</div><h1>Welcome to my library</h1><p class="sub">A growing wall of stories, ideas, and books worth keeping close.</p></header><div class="actions"><button class="primary" id="add">+ Add a book</button><button id="setReading">Set currently reading</button></div><section class="reading"><div><div class="reading-label">Currently reading</div><div class="reading-title" id="reading">Choose a book from your shelf</div></div></section><main><div class="shelf-title" id="count">My shelf</div><div class="shelf" id="shelf"></div></main></div><div class="modal" id="modal"><form class="card" id="form"><h2>Add a book</h2><p>Your books stay saved in this browser. Add as many as you like.</p><label>Book title<input required id="title" placeholder="e.g. The Midnight Library"></label><label>Author <input id="author" placeholder="Author name"></label><label>Status <select id="status"><option value="shelf">On my shelf</option><option value="reading">Currently reading</option></select></label><div class="form-actions"><button type="button" id="cancel">Cancel</button><button class="primary">Add book</button></div></form></div><script>const key='jobayer-spine-library';const colors=['#8b4137','#3e5965','#80633c','#4d754e','#443d64','#9b6a41','#705047','#315b5e','#7b3e63','#565539'];let books=JSON.parse(localStorage.getItem(key)||'null')||[{t:'1984',a:'George Orwell'},{t:'The Kite Runner',a:'Khaled Hosseini'},{t:'Sapiens',a:'Yuval Noah Harari'},{t:'Dune',a:'Frank Herbert'},{t:'Atomic Habits',a:'James Clear'},{t:'The Alchemist',a:'Paulo Coelho'},{t:'Pride and Prejudice',a:'Jane Austen'},{t:'The Little Prince',a:'Antoine de Saint-Exupéry'}];let current=localStorage.getItem(key+'-reading')||'';const shelf=document.querySelector('#shelf'),reading=document.querySelector('#reading');function save(){localStorage.setItem(key,JSON.stringify(books));localStorage.setItem(key+'-reading',current)}function render(){shelf.innerHTML=books.length?'':'<div class="empty">Your shelf is waiting.</div>';books.forEach((b,i)=>{let e=document.createElement('button');e.className='spine';e.style.setProperty('--color',colors[i%colors.length]);e.style.setProperty('--width',(27+(i*11)%24)+'px');e.style.setProperty('--height',(180+(i*17)%75)+'px');e.innerHTML='<small>'+b.t+(b.a?' · '+b.a:'')+'</small><span>'+b.t+'</span>';e.onclick=()=>{current=b.t;save();render()};shelf.append(e)});reading.textContent=current||'Choose a book from your shelf';document.querySelector('#count').textContent='My shelf · '+books.length+' books'}render();const modal=document.querySelector('#modal');document.querySelector('#add').onclick=()=>modal.classList.add('open');document.querySelector('#cancel').onclick=()=>modal.classList.remove('open');document.querySelector('#setReading').onclick=()=>alert('Click any book spine to make it your currently reading book.');document.querySelector('#form').onsubmit=e=>{e.preventDefault();let t=title.value.trim();if(!t)return;books.push({t,a:author.value.trim()});if(status.value==='reading')current=t;save();render();e.target.reset();modal.classList.remove('open')};</script></body></html>
